# Publishes a release with the one-file starters. It never runs by itself: start it by hand from the Actions tab
# (Release > Run workflow). The version is the one written in the starter files.
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^VER="\(v[0-9][0-9.]*\)"$/\1/p' release/video-blur-mac-linux.sh)
          test -n "$VER" || { echo "no version found in the starter"; exit 1; }
          grep -q "set \"VER=$VER\"" release/video-blur-windows.bat || { echo "the starters name different versions"; exit 1; }
          grep -q "^VER=\"$VER\"$" release/video-blur-android-termux.sh || { echo "the starters name different versions"; exit 1; }
          gh release create "$VER" release/video-blur-windows.bat release/video-blur-mac-linux.sh release/video-blur-android-termux.sh \
            --target "$GITHUB_SHA" --title "video-blur ${VER#v}" --notes-file release/NOTES.md
