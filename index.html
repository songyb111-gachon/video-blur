<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가림 - 영상 속 사람과 얼굴 가리기</title>
<style>
:root{--paper:#e9edf1;--panel:#fff;--ink:#18212c;--mute:#5b6b7c;--line:#d3dae2;--tape:#f2b705;--tape-ink:#2a2100;--frost:#9fb6ca;--ok:#1f7a54;--bad:#b93a26;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fd0;outline-offset:2px}
a{color:inherit}
.top{display:flex;align-items:baseline;gap:14px;padding:18px 22px 6px;max-width:980px;margin:0 auto}
.brand{font-size:30px;font-weight:800;letter-spacing:-.04em;text-decoration:none;position:relative;padding-left:30px}
.brand:before{content:"";position:absolute;left:0;top:9px;width:22px;height:22px;border-radius:50%;background:var(--frost);filter:blur(3px)}
.top .sub{color:var(--mute);font-size:14px}
main{max-width:980px;margin:0 auto;padding:10px 22px 80px}
h1{font-size:24px;letter-spacing:-.03em;margin:8px 0 2px;word-break:break-all}
h2{font-size:18px;letter-spacing:-.02em;margin:0 0 12px}
.mute{color:var(--mute)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border-radius:var(--r);padding:20px;margin:14px 0}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--tape);color:var(--tape-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600}
.btn.sm{padding:7px 12px;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.drop{border:2px dashed #b4c0cc;border-radius:var(--r);padding:44px 20px;text-align:center;background:rgba(255,255,255,.55);cursor:pointer}
.drop.over{border-color:var(--ink);background:#fff}
.drop b{font-size:20px;letter-spacing:-.02em}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);width:0;transition:width .4s}
.jobs a{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:10px 12px;border-radius:12px;text-decoration:none;background:var(--panel);margin-bottom:8px}
.jobs img{width:64px;height:64px;object-fit:cover;border-radius:8px;background:var(--line)}
.jobs .n{font-weight:700;word-break:break-all}
.tag{display:inline-block;font-size:13px;padding:2px 9px;border-radius:99px;background:var(--paper);color:var(--mute);margin-right:6px}
.tag.ok{background:#dcefe6;color:var(--ok)} .tag.bad{background:#f6ded9;color:var(--bad)} .tag.run{background:#fdf0c2;color:#6b5200}
.sec{display:grid;grid-template-columns:44px 1fr;gap:6px 10px;margin-top:26px}
.sec>.no{font-size:34px;font-weight:800;letter-spacing:-.05em;color:#aebac6;line-height:1}
.sec>div{min-width:0}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{background:var(--panel);border:2px solid transparent;border-radius:var(--r);padding:14px;text-align:left}
.mode svg{width:100%;height:auto;display:block;background:var(--paper);border-radius:10px;margin-bottom:10px}
.mode b{display:block;font-size:17px;letter-spacing:-.02em}
.mode span{font-size:14px;color:var(--mute)}
.mode.on{border-color:var(--ink)}
.mode:disabled{opacity:.5;cursor:not-allowed}
.fz{fill:var(--frost);filter:url(#bl)} .sh{fill:var(--ink)} .sel{fill:none;stroke:var(--tape);stroke-width:2;stroke-dasharray:4 3}
.opt{display:grid;grid-template-columns:120px 1fr;gap:12px 14px;align-items:center}
.opt>label{color:var(--mute);font-size:15px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(24,33,44,.18)}
select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);background:#fff}
input[type=range]{width:100%;accent-color:var(--ink)}
.range{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range img{width:100%;max-height:230px;object-fit:contain;background:#000;border-radius:8px;display:block}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:5px 0;color:var(--mute)}
.steps li.run{color:var(--ink);font-weight:700} .steps li.done{color:var(--ink)} .steps li.error{color:var(--bad)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--line)}
.done .dot,.skip .dot{background:var(--ok)} .run .dot{background:var(--tape);box-shadow:0 0 0 4px #fdf0c2} .error .dot{background:var(--bad)}
.alert{background:#f6ded9;color:#7b2416;border-radius:10px;padding:12px 14px;margin:10px 0;word-break:break-word}
.note{background:#fdf6dc;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.facts{list-style:none;margin:12px 0;padding:0}
.facts li{padding:5px 0 5px 26px;position:relative}
.facts li:before{content:"";position:absolute;left:4px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.facts li.warn:before{background:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:0;border-radius:99px;padding:5px 12px;background:var(--paper);font-size:14px}
.chips button.on{background:var(--ink);color:#fff}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair figure{margin:0} .pair img{width:100%;display:block;border-radius:8px;background:#000}
.pair figcaption{font-size:13px;color:var(--mute);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tile{background:var(--paper);border-radius:10px;padding:6px;text-align:center;border:0}
.tile img{width:100%;border-radius:6px;display:block}
.tile .st{font-size:13px;font-weight:700;margin-top:5px}
.tile.hide .st{color:var(--ok)} .tile.show img{opacity:.55} .tile.show .st{color:var(--mute)}
.res{width:100%;border-radius:8px}
.editor{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
.stage{position:relative;background:#000;border-radius:10px;overflow:hidden;line-height:0}
.stage img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools button{display:block;width:100%;text-align:left;margin-bottom:6px;border:0;border-radius:9px;padding:9px 12px;background:var(--paper);font-weight:600}
.tools button.on{background:var(--ink);color:#fff}
.tgt{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.tgt i{width:14px;height:14px;border-radius:4px;flex:none}
.tgt button{margin-left:auto;border:0;background:none;color:var(--mute);text-decoration:underline;font-size:14px}
details summary{cursor:pointer;color:var(--mute);font-size:14px;margin-top:10px}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:var(--paper);padding:10px;border-radius:8px;max-height:220px;overflow:auto}
.locked{opacity:.55;pointer-events:none}
.back{display:inline-block;margin-top:6px;color:var(--mute);font-size:14px}
input[type=text]{padding:9px 11px;border-radius:8px;border:1.5px solid var(--line);width:100%}
@media (max-width:720px){.modes{grid-template-columns:1fr}.mode{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center}.mode svg{margin:0}.editor{grid-template-columns:1fr}.opt{grid-template-columns:1fr;gap:4px 0}.opt>label{margin-top:8px}.sec{grid-template-columns:30px 1fr}.sec>.no{font-size:26px}main,.top{padding-left:14px;padding-right:14px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="bl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter></defs></svg>
<header class="top"><a class="brand" href="#/">가림</a><span class="sub">영상 속 사람과 얼굴 가리기</span></header>
<main id="app"></main>
<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const app = $('#app');
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: 'POST', headers: {'X-VB': '1', 'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({error: '응답을 읽지 못했습니다.'}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
const fmtT = s => { s = Math.max(0, s); const m = Math.floor(s / 60), r = s - m * 60; return m ? `${m}분 ${Math.round(r)}초` : `${r.toFixed(1)}초`; };
const fmtLeft = s => s < 50 ? '1분 안쪽' : s < 3600 ? `약 ${Math.round(s / 60)}분` : `약 ${Math.floor(s / 3600)}시간 ${Math.round(s % 3600 / 60)}분`;
const fmtSize = n => n > 1e9 ? (n / 1e9).toFixed(2) + ' GB' : (n / 1e6).toFixed(1) + ' MB';
const COLORS = ['#f2b705', '#e0457b', '#2fa36b', '#3d7dd8', '#e07b2f', '#8a5ad6'];
const fig = (x, head, body) => `<circle cx="${x}" cy="16" r="7" class="${head}"/><rect x="${x - 9}" y="26" width="18" height="27" rx="8" class="${body}"/>`;
const PIC = {
  faces: fig(22, 'fz', 'sh') + fig(50, 'fz', 'sh') + fig(78, 'fz', 'sh'),
  people: fig(22, 'fz', 'fz') + fig(50, 'fz', 'fz') + fig(78, 'fz', 'fz'),
  pick: fig(22, 'sh', 'sh') + fig(50, 'fz', 'fz') + fig(78, 'sh', 'sh') + '<rect x="35" y="4" width="30" height="53" rx="5" class="sel"/>'};
const MODES = {faces: ['모든 얼굴', '얼굴만 흐리게. 옷과 배경은 그대로 남습니다.'], people: ['모든 사람', '사람을 윤곽째로 흐리게. 화면이 많이 가려집니다.'], pick: ['골라서', '화면에서 직접 짚은 사람이나 물건만 흐리게.']};
let ST = null, JOB = null, JID = null, F = null, P = null, HIDE = {}, timer = null, lastSig = '', cmpSel = 0, showRange = false;

// ---------- home
async function home() {
  JID = null; JOB = null; clearInterval(timer);
  app.innerHTML = `<div class="drop" id="drop" tabindex="0" role="button"><b>가릴 영상을 여기에 놓으세요</b><div class="mute">또는 눌러서 파일 고르기</div>
    <input type="file" id="file" accept="video/*,.mkv,.mov,.mp4,.m4v" hidden><div id="up" style="max-width:420px;margin:14px auto 0"></div></div>
    <div id="pathbox"></div><div id="tools"></div><h2 style="margin-top:28px">올린 영상</h2><div class="jobs" id="list"></div>`;
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click(); drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') file.click(); };
  file.onchange = () => file.files[0] && upload(file.files[0]);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && upload(e.dataTransfer.files[0]); };
  await homeTick(); timer = setInterval(homeTick, 3000);
}
function upload(f) {
  const up = $('#up'), x = new XMLHttpRequest(); up.innerHTML = `<div class="bar"><i></i></div><div class="small mute" id="upt">올리는 중</div>`;
  x.upload.onprogress = e => { if (e.lengthComputable) { $('i', up).style.width = (100 * e.loaded / e.total) + '%'; $('#upt').textContent = `올리는 중 ${fmtSize(e.loaded)} / ${fmtSize(e.total)}`; } };
  x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} if (x.status === 200) location.hash = '#/job/' + d.id; else up.innerHTML = `<div class="alert">${esc(d.error || '올리지 못했습니다.')}</div>`; };
  x.onerror = () => up.innerHTML = '<div class="alert">올리는 중 연결이 끊겼습니다.</div>';
  x.open('POST', '/api/upload?name=' + encodeURIComponent(f.name)); x.setRequestHeader('X-VB', '1'); x.send(f);
}
function toolsHtml(t) {
  const miss = [];
  if (!t.ffmpeg) miss.push('ffmpeg를 찾을 수 없습니다. run.bat(맥·리눅스는 run.sh)으로 실행하면 자동으로 설치합니다.');
  else { if (!t.x265) miss.push('이 ffmpeg에는 libx265가 없어 HDR·HEVC 영상을 만들 수 없습니다.'); if (!t.zscale) miss.push('이 ffmpeg에는 zscale 필터가 없어 HDR 영상의 검출 정확도가 떨어질 수 있습니다.'); }
  if (!t.ultralytics) miss.push('"모든 사람" 방식에 필요한 패키지(ultralytics)가 설치되지 않았습니다. 앱 폴더의 .venv 폴더를 지우고 다시 실행하면 설치를 다시 시도합니다.');
  return miss.map(m => `<div class="note">${esc(m)}</div>`).join('');
}
async function homeTick() {
  try { ST = await api('/api/status'); } catch (e) { return; }
  if (JID) return;
  $('#tools').innerHTML = toolsHtml(ST.tools);
  if (ST.local && !$('#path')) {
    $('#pathbox').innerHTML = `<details><summary>이 PC에 있는 파일을 복사하지 않고 열기</summary><div class="row" style="margin-top:8px"><input type="text" id="path" placeholder="예: C:\\Users\\me\\Videos\\clip.mp4" style="flex:1;min-width:200px"><button class="btn sm" id="openp">열기</button></div><div id="perr"></div></details>`;
    $('#openp').onclick = async () => { try { const d = await api('/api/open', {path: $('#path').value}); location.hash = '#/job/' + d.id; } catch (e) { $('#perr').innerHTML = `<div class="alert">${esc(e.message)}</div>`; } };
  }
  $('#list').innerHTML = ST.jobs.length ? ST.jobs.map(j => {
    const i = j.info, t = j.task, run = t && (t.state === 'running' || t.state === 'queued');
    const tag = run ? `<span class="tag run">${esc(t.state === 'queued' ? '대기 중' : (t.step || '작업 중'))}</span>` : t && t.state === 'error' ? '<span class="tag bad">오류</span>' : j.has_result ? '<span class="tag ok">완성</span>' : '';
    return `<a href="#/job/${j.id}">${i ? `<img src="/api/job/${j.id}/f/scrub/s_${String(Math.floor(i.scrub.n / 2)).padStart(4, '0')}.jpg" alt="">` : '<img alt="">'}
      <div><div class="n">${esc(j.name)}</div><div class="small mute num">${i ? `${i.W}×${i.H} &nbsp; ${fmtT(i.duration)}` : '읽는 중'}</div></div><div>${tag}</div></a>`;
  }).join('') : '<p class="mute">아직 없습니다. 위에 영상을 올리면 여기에 쌓입니다.</p>';
}

// ---------- one video
const busy = () => JOB && JOB.task && (JOB.task.state === 'queued' || JOB.task.state === 'running');
const furl = rel => `/api/job/${JID}/f/${rel}?v=${(JOB.result || {}).run || 0}`;
async function openJob(id) {
  clearInterval(timer); JID = id; lastSig = ''; P = null; cmpSel = 0; showRange = false;
  try { JOB = await api('/api/job/' + id); if (!ST) ST = await api('/api/status'); } catch (e) { app.innerHTML = `<a class="back" href="#/">← 영상 목록</a><div class="alert">${esc(e.message)}</div>`; return; }
  const o = JOB.opts || {}, N = JOB.info ? JOB.info.frames : 0;
  F = {mode: o.mode || (JOB.result || {}).mode || null, part: o.a !== undefined && (o.a > 0 || o.b < N - 1), a: o.a || 0, b: o.b !== undefined ? o.b : N - 1, style: o.style || 'blur', level: o.level || 'mid',
       quality: o.quality || 'high', hdr10p: o.hdr10p !== false, bright: 0, step: o.step || 2};
  app.innerHTML = `<a class="back" href="#/">← 영상 목록</a><div id="jhead"></div><div id="sections"></div>`;
  renderAll(); timer = setInterval(poll, 1200);
}
async function poll() {
  if (!JID) return;
  try { JOB = await api('/api/job/' + JID); } catch (e) { return; }
  const t = JOB.task || {}, sig = [t.kind, t.state, (JOB.result || {}).run, !!JOB.info, JOB.pick && JOB.pick.ready, JOB.pick && JOB.pick.a, JOB.pick && JOB.pick.b].join('|');
  if (sig !== lastSig) renderAll(); else renderProgress();
}
function renderAll() {
  const t = JOB.task || {}, i = JOB.info;
  lastSig = [t.kind, t.state, (JOB.result || {}).run, !!i, JOB.pick && JOB.pick.ready, JOB.pick && JOB.pick.a, JOB.pick && JOB.pick.b].join('|');
  $('#jhead').innerHTML = `<h1>${esc(JOB.name)}</h1><div class="small mute num">` + (i ? `<span class="tag">${i.W}×${i.H}</span><span class="tag">${fmtT(i.duration)}</span><span class="tag">${i.frames}프레임</span>${i.hdr ? `<span class="tag">${i.hdr10p ? 'HDR10+' : 'HDR'}</span>` : ''}` : '')
    + `<button class="btn ghost sm" id="del" style="float:right">이 영상 지우기</button></div>`;
  if ($('#del')) $('#del').onclick = async () => { if (!confirm('이 영상과 작업 결과를 앱에서 지웁니다. 원본 파일은 그대로 둡니다.')) return; try { await api(`/api/job/${JID}/delete`, {}); location.hash = '#/'; } catch (e) { alert(e.message); } };
  if (!i) { $('#sections').innerHTML = `<div class="panel" style="clear:both"><h2>${t.state === 'error' || t.state === 'canceled' ? '영상을 읽지 못했습니다' : '영상을 읽는 중입니다'}</h2><div id="prog"></div></div>`; renderProgress(); return; }
  if (F.b === undefined || F.b < 0) F.b = i.frames - 1;
  $('#sections').innerHTML = `<section class="sec"><div class="no">1</div><div><h2>무엇을 가릴까요</h2><div class="modes" id="modes"></div></div></section>
    <section class="sec"><div class="no">2</div><div><h2>설정</h2><div id="setup"></div></div></section>
    <section class="sec" id="s3" hidden><div class="no">3</div><div><h2>진행</h2><div class="panel" id="prog"></div></div></section>
    <section class="sec" id="s4" hidden><div class="no">4</div><div><h2>결과</h2><div id="result"></div></div></section>`;
  renderModes(); renderSetup(); renderProgress(); renderResult();
}
function renderModes() {
  const el = $('#modes'); el.classList.toggle('locked', busy());
  el.innerHTML = Object.keys(MODES).map(k => `<button class="mode ${F.mode === k ? 'on' : ''}" data-m="${k}" ${k === 'people' && ST && !ST.tools.ultralytics ? 'disabled title="ultralytics 패키지가 필요합니다"' : ''}>
    <svg viewBox="0 0 100 60" aria-hidden="true">${PIC[k]}</svg><div><b>${MODES[k][0]}</b><span>${MODES[k][1]}</span></div></button>`).join('');
  $$('.mode', el).forEach(b => b.onclick = () => { F.mode = b.dataset.m; renderModes(); renderSetup(); });
}
const scrubSrc = q => `/api/job/${JID}/f/scrub/s_${String(q).padStart(4, '0')}.jpg`;
function rangeHtml() {
  const s = JOB.info.scrub, sa = Math.min(s.n - 1, Math.floor(F.a / s.k)), sb = Math.min(s.n - 1, Math.ceil(F.b / s.k));
  return `<div class="range"><div><img id="ra_img" src="${scrubSrc(sa)}" alt=""><input type="range" id="ra" min="0" max="${s.n - 1}" value="${sa}"><div class="small num">시작 <b id="ra_t"></b></div></div>
    <div><img id="rb_img" src="${scrubSrc(sb)}" alt=""><input type="range" id="rb" min="0" max="${s.n - 1}" value="${sb}"><div class="small num">끝 <b id="rb_t"></b></div></div></div><div class="small mute num" id="r_len" style="margin-top:6px"></div>`;
}
function rangeWire(onchange) {
  const i = JOB.info, s = i.scrub, ra = $('#ra'), rb = $('#rb');
  const upd = () => {
    let x = +ra.value, y = +rb.value; if (x > y) { if (document.activeElement === ra) { y = x; rb.value = y; } else { x = y; ra.value = x; } }
    F.a = Math.min(i.frames - 1, x * s.k); F.b = y >= s.n - 1 ? i.frames - 1 : Math.min(i.frames - 1, y * s.k);
    $('#ra_img').src = scrubSrc(x); $('#rb_img').src = scrubSrc(y); $('#ra_t').textContent = fmtT(F.a * i.dt); $('#rb_t').textContent = fmtT(F.b * i.dt);

    $$('[data-go]', el).forEach(a => a.onclick = e => { e.preventDefault(); P.j = (P.targets[+a.dataset.go].ref - pk.a) / pk.step; ps.value = P.j; load(); draw(); });
    const u = $('#uncrop'); if (u) u.onclick = () => { P.crop = null; P.targets.forEach(t => t.polys = null); if (P.cur) P.cur.polys = null; side(); draw(); };
    $('#gopick').disabled = !P.targets.length; $('#pest2').textContent = P.targets.length ? `화면 분석 ${g}장, 처음엔 ${fmtLeft(g * 20 / Math.max(2, (ST || {}).cores || 2))} 걸립니다.` : '대상을 하나 이상 추가하세요.';
  };
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.max(0, Math.min(i.W, (e.clientX - r.left) / r.width * i.W)), Math.max(0, Math.min(i.H, (e.clientY - r.top) / r.height * i.H))]; };
  const cur = () => { if (!P.cur || P.cur.ref !== frame()) P.cur = {ref: frame(), box: null, pts: [], lab: [], polys: null}; return P.cur; };
  cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); const [x, y] = pos(e); if (P.tool === 'box' || P.tool === 'crop') P.drag = {x0: x, y0: y, x1: x, y1: y}; };
  cv.onpointermove = e => { if (P.drag) { [P.drag.x1, P.drag.y1] = pos(e); draw(); } };
  cv.onpointerup = e => {
    const [x, y] = pos(e);
    if (P.drag) {
      const d = P.drag, b = [Math.min(d.x0, d.x1), Math.min(d.y0, d.y1), Math.max(d.x0, d.x1), Math.max(d.y0, d.y1)].map(Math.round); P.drag = null;
      if (b[2] - b[0] > 12 && b[3] - b[1] > 12) {
        if (P.tool === 'crop') { P.crop = b.map(v => v - v % 2); P.targets.forEach(t => t.polys = null); if (P.cur) P.cur.polys = null; P.tool = 'box'; }
        else { const c = cur(); c.box = b; c.polys = null; P.tool = 'pos'; P.msg = '이제 대상 위에 점을 한두 개 찍으세요.'; }
      }
    } else if (P.tool === 'pos' || P.tool === 'neg') { const c = cur(); c.pts.push([Math.round(x), Math.round(y)]); c.lab.push(P.tool === 'pos' ? 1 : 0); c.polys = null; P.msg = ''; }
    side(); draw();
  };
  const seed = async () => {
    const c = P.cur; if (!c || (!c.box && !c.pts.length)) { P.msg = '먼저 박스를 그리거나 점을 찍으세요.'; side(); return false; }
    P.msg = '윤곽을 계산하는 중입니다. 이 프레임은 처음이면 10~20초 걸립니다.'; side(); $('#seed').disabled = $('#add').disabled = true;
    try { const r = await api(`/api/job/${JID}/seed`, {ref: c.ref, box: c.box, pts: c.pts, lab: c.lab, crop: P.crop}); c.polys = r.polys; P.msg = r.polys.length ? '색칠된 부분이 가려질 윤곽입니다. 맞으면 "대상으로 추가"를 누르세요.' : '윤곽을 잡지 못했습니다. 박스와 점을 다시 지정해 보세요.'; return r.polys.length > 0; }
    catch (e) { P.msg = `<span style="color:var(--bad)">${esc(e.message)}</span>`; return false; }
    finally { $('#seed').disabled = $('#add').disabled = false; side(); draw(); }
  };
  $('#seed').onclick = seed;
  $('#add').onclick = async () => { if (!P.cur) { P.msg = '먼저 박스를 그리거나 점을 찍으세요.'; side(); return; } if (!P.cur.polys && !(await seed())) return; P.targets.push(P.cur); P.cur = null; P.tool = 'box'; P.msg = '추가했습니다. 다른 대상이 있으면 같은 방법으로 더 고르세요.'; side(); draw(); };
  $('#clr').onclick = () => { P.cur = null; P.msg = ''; P.tool = 'box'; side(); draw(); };
  $$('.tools button', el).forEach(b => b.onclick = () => { P.tool = b.dataset.t; side(); });
  ps.oninput = () => { P.j = +ps.value; load(); draw(); }; img.onload = draw; window.onresize = () => $('#pc') && draw();
  $('#gopick').onclick = async () => {
    const body = {targets: P.targets.map(t => ({ref: t.ref, box: t.box, pts: t.pts, lab: t.lab})), crop: P.crop, style: F.style, level: F.level, quality: F.quality, hdr10p: F.hdr10p};
    try { await api(`/api/job/${JID}/pick`, body); await poll(); $('#s3').scrollIntoView({behavior: 'smooth', block: 'start'}); } catch (e) { $('#goerr').innerHTML = `<div class="alert">${esc(e.message)}</div>`; }
  };
  load(); side();
}

function route() { const m = location.hash.match(/^#\/job\/([\w-]+)/); HIDE = {}; if (m) openJob(m[1]); else home(); }
window.onhashchange = route; route();
</script>
</body>
